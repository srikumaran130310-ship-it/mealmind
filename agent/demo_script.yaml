title: "MealMind — AI Meal Planner powered by Strands Decider 2B"
pitch: "Tell MealMind what you have, your budget and time — it picks the best meal and explains why."
features:
  - "Ask for meals by ingredients, budget, time, and dietary needs"
  - "Strands Decider 2B evaluates every candidate meal before it is recommended"
  - "Partial fits are shown with a caveat; unsuitable meals are silently skipped"
  - "Get full recipe steps, cost breakdown, or nutrition info for any suggestion"
  - "Runs on Amazon Bedrock AgentCore Runtime"
eager: false
intro: "MealMind is an AI meal planner that runs on Amazon Bedrock. Before recommending any meal, it uses Strands Decider 2B to check whether the meal actually fits your ingredients, budget, time, and dietary needs — not just guessing."
intro_normal: "MealMind runs on Amazon Bedrock AgentCore Runtime. Strands Decider 2B evaluates every candidate meal against your constraints before MealMind recommends it."
turns:
  - say: "I have rice, eggs, onion, soy sauce, and carrot. My budget is ₹400, I have 25 minutes, and I'm vegetarian."
    narrate: "The user lists what they have. The Decider evaluates each candidate meal before any recommendation is made."
  - say: "What are the steps for making the first one?"
    narrate: "The user asks for the recipe. No decision is needed here — this is a straightforward lookup."
  - say: "I only have bread and cheese, ₹250, 10 minutes. I'm vegetarian."
    narrate: "A simpler request — fewer ingredients, tight budget. The Decider checks what fits."
  - say: "Is the grilled cheese sandwich gluten-free? And how many calories does it have?"
    narrate: "The user asks about nutrition and dietary info for their chosen meal."
outro: "One forward pass per candidate meal. Typed answers with calibrated confidence. The Decider blocks unsuitable meals before the LLM ever sees them — saving tokens, time, and bad recommendations."
